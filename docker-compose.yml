services:
  pz-server:
    build: .
    image: pz-server:local
    platform: linux/amd64
    container_name: pz-server
    restart: unless-stopped
    stop_grace_period: 120s
    environment:
      SERVER_NAME: ${SERVER_NAME:-pzserver}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      MEMORY: ${MEMORY:-3g}
      SKIP_UPDATE: ${SKIP_UPDATE:-false}
      STOP_TIMEOUT: ${STOP_TIMEOUT:-90}
      TZ: ${TZ:-UTC}
      PZ_OPEN: ${PZ_OPEN:-}
      PZ_PUBLIC: ${PZ_PUBLIC:-}
      PZ_PUBLIC_NAME: ${PZ_PUBLIC_NAME:-}
      PZ_SERVER_PASSWORD: ${PZ_SERVER_PASSWORD:-}
      PZ_MAX_PLAYERS: ${PZ_MAX_PLAYERS:-}
      PZ_PAUSE_EMPTY: ${PZ_PAUSE_EMPTY:-}
    ports:
      - '${GAME_PORT:-16261}:16261/udp'
      - '${PLAYER_PORT:-16262}:16262/udp'
    volumes:
      - pz-data:/home/pz/Zomboid
      - pz-server:/opt/pzserver
    mem_limit: ${MEM_LIMIT:-5g}

volumes:
  pz-data:
    name: pz-data
  pz-server:
    name: pz-server
