services:
  pz-server:
    build: .
    image: pz-server:local
    platform: linux/amd64
    container_name: pz-server
    restart: unless-stopped
    stop_grace_period: 120s
    environment:
      SERVER_NAME: ${SERVER_NAME:-pzserver}
      SERVER_ADMIN_PASSWORD: ${SERVER_ADMIN_PASSWORD:-}
      SERVER_MEMORY: ${SERVER_MEMORY:-3g}
      STEAM_BRANCH: ${STEAM_BRANCH:-public}
      STEAM_SKIP_UPDATE: ${STEAM_SKIP_UPDATE:-false}
      STEAM_VALIDATE: ${STEAM_VALIDATE:-false}
      STEAM_REINSTALL: ${STEAM_REINSTALL:-false}
      STEAM_UPDATE_ATTEMPTS: ${STEAM_UPDATE_ATTEMPTS:-3}
      SERVER_STOP_TIMEOUT: ${SERVER_STOP_TIMEOUT:-90}
      SERVER_START_TIMEOUT: ${SERVER_START_TIMEOUT:-300}
      UPDATE_CHECK_INTERVAL: ${UPDATE_CHECK_INTERVAL:-3600}
      UPDATE_FORCE_SECONDS: ${UPDATE_FORCE_SECONDS:-1800}
      TZ: ${TZ:-UTC}
      SERVER_WHITELIST_STEAMID: ${SERVER_WHITELIST_STEAMID:-}
      PZ_OPEN: ${PZ_OPEN:-}
      PZ_PUBLIC: ${PZ_PUBLIC:-}
      PZ_PUBLIC_NAME: ${PZ_PUBLIC_NAME:-}
      PZ_SERVER_PASSWORD: ${PZ_SERVER_PASSWORD:-}
      PZ_MAX_PLAYERS: ${PZ_MAX_PLAYERS:-}
      PZ_PAUSE_EMPTY: ${PZ_PAUSE_EMPTY:-}
      PZ_RCON_PORT: ${PZ_RCON_PORT:-27015}
      PZ_RCON_PASSWORD: ${PZ_RCON_PASSWORD:-}
      PZ_WORKSHOP_ITEMS: ${PZ_WORKSHOP_ITEMS:-}
      PZ_MODS: ${PZ_MODS:-}
      PZ_MAP: ${PZ_MAP:-}
      PZ_PUBLIC_DESCRIPTION: ${PZ_PUBLIC_DESCRIPTION:-}
      PZ_WELCOME_MESSAGE: ${PZ_WELCOME_MESSAGE:-}
      PZ_PVP: ${PZ_PVP:-}
      PZ_BACKUPS_PERIOD: ${PZ_BACKUPS_PERIOD:-}
      PZ_BACKUPS_COUNT: ${PZ_BACKUPS_COUNT:-}
      PZ_SAVE_WORLD_EVERY_MINUTES: ${PZ_SAVE_WORLD_EVERY_MINUTES:-}
      PZ_UPNP: ${PZ_UPNP:-}
    ports:
      - '${HOST_GAME_PORT:-16261}:16261/udp'
      - '${HOST_PLAYER_PORT:-16262}:16262/udp'
      - '${HOST_RCON_BIND:-127.0.0.1}:${PZ_RCON_PORT:-27015}:${PZ_RCON_PORT:-27015}/tcp'
    volumes:
      - pz-data:/home/pz/Zomboid
      - pz-server:/opt/pzserver
    mem_limit: ${HOST_MEM_LIMIT:-5g}
    # The game console is streamed to the container log, which grows without bound otherwise.
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

volumes:
  pz-data:
    name: pz-data
  pz-server:
    name: pz-server
